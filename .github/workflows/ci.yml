name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── auth-service ──────────────────────────────────────────
  auth-service:
    name: auth-service — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn package -DskipTests -q
      - name: Test
        run: mvn test -q

  # ─── catalog-order-service ─────────────────────────────────
  catalog-order-service:
    name: catalog-order-service — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn package -DskipTests -q
      - name: Test
        run: mvn test -q

  # ─── inventory-app ─────────────────────────────────────────
  inventory-app:
    name: inventory-app — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-notification-service/inventory-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn package -DskipTests -q
      - name: Test
        run: mvn test -q

  # ─── notification-worker ───────────────────────────────────
  notification-worker:
    name: notification-worker — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-notification-service/notification-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn package -DskipTests -q
      - name: Test
        run: mvn test -q

  # ─── frontend ──────────────────────────────────────────────
  frontend:
    name: frontend — Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8081
          VITE_CATALOG_API_URL: http://localhost:8082
          VITE_INVENTORY_API_URL: http://localhost:8083

  # ─── Docker Build (validate Dockerfiles) ───────────────────
  docker-build:
    name: Docker — Validate builds
    runs-on: ubuntu-latest
    needs: [auth-service, catalog-order-service, inventory-app, notification-worker, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build auth-service image
        run: docker build -t foodwise/auth-service:ci auth-service/
      - name: Build catalog-order-service image
        run: docker build -t foodwise/catalog-order-service:ci catalog-order-service/
      - name: Build inventory-app image
        run: docker build -t foodwise/inventory-app:ci inventory-notification-service/inventory-app/
      - name: Build notification-worker image
        run: docker build -t foodwise/notification-worker:ci inventory-notification-service/notification-worker/
      - name: Build frontend image
        run: docker build -t foodwise/frontend:ci frontend/
